version: '3.8'

services:

  # ---------------------------------------------------------------
  # Kafka (KRaft mode, no Zookeeper)
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # Kafka init: creates topics
  # ---------------------------------------------------------------
  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --replication-factor 1 --partitions 1 \
          --topic flight-delay-ml-request
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
          --bootstrap-server kafka:9092 \
          --replication-factor 1 --partitions 1 \
          --topic flight-delay-ml-response
        echo "Topics created!"

  # ---------------------------------------------------------------
  # Cassandra
  # ---------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ---------------------------------------------------------------
  # Cassandra init: creates keyspace, tables and imports distances
  # ---------------------------------------------------------------
  cassandra-init:
    image: python:3.11-slim
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./cassandra-init.sh:/cassandra-init.sh
    command: bash /cassandra-init.sh

  # ---------------------------------------------------------------
  # MinIO (S3-compatible storage for models and Iceberg)
  # ---------------------------------------------------------------
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data_minio:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------
  # Spark Master (Standalone cluster)
  # ---------------------------------------------------------------
  spark-master:
    image: eclipse-temurin:17-jre
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"   # Spark Web UI
      - "7077:7077"   # Spark master (client connections)
      - "6066:6066"   # Spark master REST API (cluster mode submissions)
    volumes:
      - ./spark-4.1.1:/opt/spark
      - ./ivy2-cache:/root/.ivy2
    environment:
      SPARK_HOME: /opt/spark
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        exec /opt/spark/bin/spark-class \
          org.apache.spark.deploy.master.Master \
          --host spark-master \
          --port 7077 \
          --webui-port 8080
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/spark-master/7077"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------
  # Spark Worker 1
  # ---------------------------------------------------------------
  spark-worker-1:
    image: eclipse-temurin:17-jre
    container_name: spark-worker-1
    hostname: spark-worker-1
    ports:
      - "8083:8081"  # Worker 1 Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark-4.1.1:/opt/spark
      - ./ivy2-cache:/root/.ivy2
      - /tmp/spark-worker-1:/tmp/spark-worker
    environment:
      SPARK_HOME: /opt/spark
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        exec /opt/spark/bin/spark-class \
          org.apache.spark.deploy.worker.Worker \
          --webui-port 8081 \
          spark://spark-master:7077

  # ---------------------------------------------------------------
  # Spark Worker 2
  # ---------------------------------------------------------------
  spark-worker-2:
    image: eclipse-temurin:17-jre
    container_name: spark-worker-2
    hostname: spark-worker-2
    ports:
      - "8082:8082"   # Worker 2 Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark-4.1.1:/opt/spark
      - ./ivy2-cache:/root/.ivy2
      - /tmp/spark-worker-2:/tmp/spark-worker
    environment:
      SPARK_HOME: /opt/spark
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        exec /opt/spark/bin/spark-class \
          org.apache.spark.deploy.worker.Worker \
          --webui-port 8082 \
          spark://spark-master:7077

  # ---------------------------------------------------------------
  # HTTP server — serves the predictor JAR to Spark workers
  # ---------------------------------------------------------------
  jar-server:
    image: python:3.11-slim
    container_name: jar-server
    hostname: jar-server
    volumes:
      - ./flight_prediction/target/scala-2.13:/srv
    working_dir: /srv
    command: python3 -m http.server 8888
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------
  # Spark Streaming predictor (runs on the Spark cluster)
  # ---------------------------------------------------------------
  spark-predictor:
    build:
      context: flight_prediction
      dockerfile: Dockerfile.spark
    container_name: spark-predictor
    depends_on:
      jar-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
    volumes:
      - ./spark-4.1.1:/opt/spark
      - ./ivy2-cache:/root/.ivy2
    environment:
      KAFKA_HOST: kafka
      CASSANDRA_HOST: cassandra
      MINIO_HOST: minio
      SPARK_MASTER_HOST: spark-master

  # ---------------------------------------------------------------
  # Flask web application
  # ---------------------------------------------------------------
  flask:
    build:
      context: resources/web
      dockerfile: Dockerfile.flask
    container_name: flask
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "5001:5001"
    environment:
      KAFKA_HOST: kafka
      CASSANDRA_HOST: cassandra
      PROJECT_HOME: /app




  # ---------------------------------------------------------------
  # MLflow tracking server (UI + artifact store → MinIO)
  # ---------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    container_name: mlflow
    hostname: mlflow
    ports:
      - "5000:5000"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root s3://lakehouse/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # Airflow init — initialises DB and creates admin user (one-shot)
  # ---------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.9.0
    container_name: airflow-init
    user: "0:0"
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./airflow:/opt/airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'practica_creativa_secret'
    command: >-
      bash -c "
      chmod -R 777 /opt/airflow/logs &&
      chmod -R 777 /opt/airflow/dags &&
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "

  # ---------------------------------------------------------------
  # Airflow webserver  (http://localhost:8090)
  # ---------------------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: airflow-webserver
    hostname: airflow-webserver
    user: "0:0"
    ports:
      - "8090:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow:/opt/airflow
      - ./spark-4.1.1:/opt/spark
      - .:/opt/project
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'practica_creativa_secret'
      SPARK_HOME: /opt/spark
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------
  # Airflow scheduler
  # ---------------------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: airflow-scheduler
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow:/opt/airflow
      - ./spark-4.1.1:/opt/spark
      - ./ivy2-cache:/root/.ivy2
      - .:/opt/project
      - ./airflow/k8s-spark-config.yaml:/root/.kube/config:ro
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'practica_creativa_secret'
      SPARK_HOME: /opt/spark
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      _PIP_ADDITIONAL_REQUIREMENTS: "mlflow boto3"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "apt-get update -qq && apt-get install -y -qq default-jre-headless && export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java)))) && echo \"JAVA_HOME=$JAVA_HOME\" && airflow scheduler"
