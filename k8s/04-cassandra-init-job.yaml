---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-init-script
  namespace: practica
data:
  init.sh: |
    #!/bin/bash
    set -e

    echo "Installing cassandra-driver..."
    pip install cassandra-driver -q

    echo "Running Cassandra init..."
    python3 <<'PYEOF'
    import time
    from cassandra.cluster import Cluster

    print("Waiting for Cassandra to be ready...")
    while True:
        try:
            cluster = Cluster(['cassandra'])
            session = cluster.connect()
            print("Cassandra is ready!")
            break
        except Exception as e:
            print(f"Cassandra not ready yet: {e}, retrying in 5s...")
            time.sleep(5)

    session.execute("""
        CREATE KEYSPACE IF NOT EXISTS agile_data_science
        WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}
    """)
    session.set_keyspace('agile_data_science')

    session.execute("""
        CREATE TABLE IF NOT EXISTS origin_dest_distances (
            Origin text,
            Dest text,
            Distance double,
            PRIMARY KEY (Origin, Dest)
        )
    """)

    session.execute("""
        CREATE TABLE IF NOT EXISTS flight_delay_ml_response (
            uuid text PRIMARY KEY,
            origin text,
            dest text,
            carrier text,
            dayofweek int,
            dayofyear int,
            dayofmonth int,
            depdelay double,
            distance double,
            prediction double,
            flightdate text,
            timestamp text,
            route text
        )
    """)

    print("Schema created. Importing distances...")

    import json
    count = 0
    with open('/data/origin_dest_distances.jsonl') as f:
        for line in f:
            doc = json.loads(line)
            session.execute(
                "INSERT INTO origin_dest_distances (Origin, Dest, Distance) VALUES (%s, %s, %s)",
                (doc['Origin'], doc['Dest'], float(doc['Distance']))
            )
            count += 1

    print(f"Imported {count} distance records.")
    cluster.shutdown()
    print("Cassandra init completed successfully.")
    PYEOF

---
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-init
  namespace: practica
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cassandra-init
          image: python:3.11-slim
          command: ["/bin/bash", "/scripts/init.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: scripts
          configMap:
            name: cassandra-init-script
            defaultMode: 0755
        - name: data
          configMap:
            name: cassandra-init-data
