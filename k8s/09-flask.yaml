---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: practica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      initContainers:
        - name: wait-for-kafka-cassandra
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z kafka 9092; do echo "Waiting for Kafka..."; sleep 3; done
              until nc -z cassandra 9042; do echo "Waiting for Cassandra..."; sleep 3; done
              echo "Dependencies ready."
      containers:
        - name: flask
          image: europe-west1-docker.pkg.dev/practicacreativa-497711/practica/flask:latest
          ports:
            - containerPort: 5001
          env:
            - name: KAFKA_HOST
              value: "kafka"
            - name: CASSANDRA_HOST
              value: "cassandra"
            - name: PROJECT_HOME
              value: "/app"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# LoadBalancer: exposes Flask publicly on port 80 → container 5001
apiVersion: v1
kind: Service
metadata:
  name: flask
  namespace: practica
spec:
  type: LoadBalancer
  selector:
    app: flask
  ports:
    - name: http
      port: 80
      targetPort: 5001
      protocol: TCP
