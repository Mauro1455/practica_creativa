---
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-predictor
  namespace: practica
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: spark-predictor
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z kafka 9092; do sleep 3; done
              until nc -z cassandra 9042; do sleep 3; done
              until nc -z minio 9000; do sleep 3; done
              until nc -z jar-server 8888; do sleep 3; done
              echo "All dependencies ready."
      containers:
        - name: spark-predictor
          image: europe-west1-docker.pkg.dev/practicacreativa-497711/practica/spark-predictor:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_HOST
              value: "kafka"
            - name: CASSANDRA_HOST
              value: "cassandra"
            - name: MINIO_HOST
              value: "minio"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
