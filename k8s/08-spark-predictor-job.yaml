---
# Job (not Deployment) because cluster mode: spark-submit submits the driver
# to the Spark Master and then exits. The driver runs on a Spark worker pod,
# which already advertises its pod IP (routable in-cluster) via SPARK_LOCAL_HOSTNAME.
# A Job runs once and does not restart on success, avoiding duplicate drivers.
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-predictor
  namespace: practica
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: spark-predictor
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Spark Master REST (6066)..."
              until nc -z spark-master-svc 6066; do sleep 3; done
              echo "Waiting for Kafka (9092)..."
              until nc -z kafka 9092; do sleep 3; done
              echo "Waiting for Cassandra (9042)..."
              until nc -z cassandra 9042; do sleep 3; done
              echo "Waiting for MinIO (9000)..."
              until nc -z minio 9000; do sleep 3; done
              echo "Waiting for jar-server (8888)..."
              until nc -z jar-server 8888; do sleep 3; done
              echo "All dependencies ready."
      containers:
        - name: spark-predictor
          image: europe-west1-docker.pkg.dev/practicacreativa-497711/practica/spark-predictor:latest
          env:
            - name: KAFKA_HOST
              value: "kafka"
            - name: CASSANDRA_HOST
              value: "cassandra"
            - name: MINIO_HOST
              value: "minio"
          volumeMounts:
            - name: ivy-cache
              mountPath: /root/.ivy2
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
      volumes:
        - name: ivy-cache
          emptyDir: {}
